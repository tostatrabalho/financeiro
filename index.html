<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos Familiar</title>
    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0; 
            padding: 40px 20px; 
        }

        .container { 
            max-width: 750px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1); 
        }

        h2, h3 { margin-top: 0; color: var(--text-main); }
        
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        input, button { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button { 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background-color 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }

        .logout-btn { 
            background-color: var(--danger); 
            width: auto;
            padding: 8px 16px;
            margin: 0;
            font-size: 13px;
        }
        .logout-btn:hover { background-color: var(--danger-hover); }

        .summary-card {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }
        .summary-card span { font-size: 24px; font-weight: 700; display: block; margin-top: 5px; }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table { width: 100%; border-collapse: collapse; background: white; text-align: left; font-size: 14px; }
        th, td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
        th { background-color: #f1f5f9; font-weight: 600; color: var(--text-muted); }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #f8fafc; }

        .hidden { display: none; }
        #login-error { font-size: 13px; margin-top: 5px; }
        
        .login-box {
            max-width: 400px;
            margin: 40px auto;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Tela de Login -->
    <div id="login-section" class="login-box">
        <h2>Painel Financeiro</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Faça login para gerenciar os gastos.</p>
        <input type="email" id="email" placeholder="Seu e-mail">
        <input type="password" id="password" placeholder="Sua senha">
        <button onclick="handleLogin()">Entrar</button>
        <p id="login-error" style="color: var(--danger);"></p>
    </div>

    <!-- Tela do Painel de Gastos -->
    <div id="app-section" class="hidden">
        <div class="header-flex">
            <div>
                <h2>Controle de Gastos</h2>
                <small style="color: var(--text-muted);">Logado como: <strong id="user-display"></strong></small>
            </div>
            <button class="logout-btn" onclick="handleLogout()">Sair</button>
        </div>

        <!-- Card do Valor Total -->
        <div class="summary-card">
            <div>Gasto Total Acumulado</div>
            <span id="total-amount">R$ 0,00</span>
        </div>

        <h3>Histórico de Despesas</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Valor (R$)</th>
                        <th>Categoria</th>
                        <th>Usuário</th>
                    </tr>
                </thead>
                <tbody id="expenses-table-body">
                    <!-- Dados entram via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ⚠️ Cole aqui as suas credenciais reais do Supabase
    const SUPABASE_URL = 'https://vrjqsjewututwtbqzxpx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_jUb90WHv_J6PRWv6S2H83g_-jTE_dhq';
    
    // Usando supabaseClient para evitar conflito com a biblioteca global
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
            document.getElementById('login-error').innerText = 'Erro ao entrar: ' + error.message;
        } else {
            checkUser();
        }
    }

    async function handleLogout() {
        await supabaseClient.auth.signOut();
        checkUser();
    }

    async function checkUser() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        
        if (session) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            document.getElementById('user-display').innerText = session.user.email;
            loadExpenses();
        } else {
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('app-section').classList.add('hidden');
        }
    }

    async function loadExpenses() {
        const { data, error } = await supabaseClient
            .from('expenses')
            .select('*')
            .order('created_at', { ascending: false });

        const tbody = document.getElementById('expenses-table-body');
        tbody.innerHTML = '';

        if (error) {
            console.error('Erro ao buscar gastos:', error);
            return;
        }

        let totalGeral = 0;

        if (data && data.length > 0) {
            data.forEach(item => {
                const valorNumerico = Number(item.amount) || 0;
                totalGeral += valorNumerico;

                const row = document.createElement('tr');
                const dateStr = item.created_at ? new Date(item.created_at).toLocaleDateString('pt-BR') : '-';
                
                row.innerHTML = `
                    <td>${dateStr}</td>
                    <td>${item.description || '-'}</td>
                    <td><strong>R$ ${valorNumerico.toFixed(2)}</strong></td>
                    <td>${item.category || '-'}</td>
                    <td>${item.user_email || '-'}</td>
                `;
                tbody.appendChild(row);
            });
        } else {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #64748b;">Nenhum gasto registrado ainda.</td></tr>`;
        }

        document.getElementById('total-amount').innerText = `R$ ${totalGeral.toFixed(2)}`;
    }

    checkUser();
</script>

</body>
</html>
