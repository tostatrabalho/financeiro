<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Financeiro</title>
    <!-- Importa a biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Meu Controle Financeiro</h1>
    
    <!-- Elemento onde vai aparecer o total -->
    <h2>Total Gastos: <span id="total-gastos">R$ 0,00</span></h2>

    <!-- Tabela de gastos -->
    <table border="1" id="tabela-gastos">
        <thead>
            <tr>
                <th>Data</th>
                <th>Descrição</th>
                <th>Valor (R$)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Os dados entram aqui via JavaScript -->
        </tbody>
    </table>

    <script>
        // Substitua com a sua URL e a sua Chave Pública (Anon Key) do Supabase
        const SUPABASE_URL = 'https://vrjqsjewututwtbqzxpx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_jUb90WHv_J6PRWv6S2H83g_-jTE_dhq';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function carregarGastos() {
            // Busca os dados da tabela 'gastos' no Supabase (substitua 'gastos' pelo nome real da sua tabela se for diferente)
            const { data, error } = await supabaseClient
                .from('gastos')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Erro ao buscar dados:', error);
                return;
            }

            const tbody = document.querySelector('#tabela-gastos tbody');
            tbody.innerHTML = '';
            
            let total = 0;

            data.forEach(item => {
                total += Number(item.valor); // Soma o valor do gasto

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${new Date(item.created_at).toLocaleDateString()}</td>
                    <td>${item.descricao}</td>
                    <td>R$ ${Number(item.valor).toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });

            // Atualiza o elemento HTML com o total formatado
            document.getElementById('total-gastos').innerText = `R$ ${total.toFixed(2)}`;
        }

        // Executa a função ao carregar a página
        carregarGastos();
    </script>
</body>
</html>
